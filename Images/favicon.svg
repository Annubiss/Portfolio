<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0a0118"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Glow halo -->
  <circle cx="32" cy="32" r="28" fill="url(#starGlow)"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#7c3aed" stroke-width="0.6" stroke-opacity="0.5"/>

  <!-- Magic circle rune ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#a855f7" stroke-width="0.4" stroke-dasharray="2 3" stroke-opacity="0.6"/>

  <!-- Main 6-pointed star (Star of Merlin) -->
  <!-- Upward triangle -->
  <polygon points="32,10 42.5,28 21.5,28" fill="none" stroke="#c084fc" stroke-width="1.2" filter="url(#glow)" stroke-linejoin="round"/>
  <!-- Downward triangle -->
  <polygon points="32,54 21.5,36 42.5,36" fill="none" stroke="#818cf8" stroke-width="1.2" filter="url(#glow)" stroke-linejoin="round"/>

  <!-- Center hexagon fill (subtle) -->
  <polygon points="32,26 37.5,32 32,38 26.5,32" fill="#7c3aed" fill-opacity="0.25"/>

  <!-- Center star burst -->
  <circle cx="32" cy="32" r="3.5" fill="#e879f9" filter="url(#softglow)"/>
  <circle cx="32" cy="32" r="1.8" fill="#ffffff"/>

  <!-- Small sparkle dots at star tips -->
  <circle cx="32" cy="11" r="1.2" fill="#e879f9" filter="url(#glow)"/>
  <circle cx="32" cy="53" r="1.2" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="14.5" cy="21.5" r="1" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="49.5" cy="21.5" r="1" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="14.5" cy="42.5" r="1" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="49.5" cy="42.5" r="1" fill="#818cf8" filter="url(#glow)"/>

  <!-- Tiny floating sparkles -->
  <circle cx="20" cy="16" r="0.7" fill="#f0abfc" fill-opacity="0.8"/>
  <circle cx="46" cy="14" r="0.5" fill="#a5b4fc" fill-opacity="0.9"/>
  <circle cx="52" cy="30" r="0.6" fill="#f0abfc" fill-opacity="0.7"/>
  <circle cx="12" cy="38" r="0.5" fill="#a5b4fc" fill-opacity="0.8"/>
  <circle cx="18" cy="50" r="0.7" fill="#f0abfc" fill-opacity="0.6"/>
  <circle cx="48" cy="50" r="0.5" fill="#a5b4fc" fill-opacity="0.7"/>
</svg>
