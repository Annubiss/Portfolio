<head>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="every-visible-part">
    <h1>Random User Generator</h1>

    <div id="btns-select-data">
        <div id="btns-row--top">
            <button data-field="name">Name</button>
            <button data-field="email">Email</button>
            <button data-field="picture">Picture</button>
            <button data-field="password">Password</button>
            <button data-field="location">Location</button>
            <button data-field="phone">Phone</button>
            <button data-field="gender">Gender</button>
            <button data-field="birthday">Birthday</button>
            <button id="select-all">Select all fields</button>
        </div>
        <div id="btns-row--bottom">
            <button id="get-user-button" data-field="getUser">Get User</button>
            <button id="save-users-button">Save users</button>
        </div>
    </div>

    

    <div id="users"></div>

    <h3>
        Saved Users
    </h3>
    <div id="saved-users"></div>
    </div>
</body>
